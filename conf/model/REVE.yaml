name: REVE
sfreq: 200
func_build_dataset: src.utils.build_dataset_REVE
pipeline: [ linear_probing, fine_tuning ]

batch_size: 256


linear_probing:
  n_epochs: 200
  trainable: [ final_layer ]
  optimizer:
    module: torch.optim
    name: AdamW
    kwargs:
      lr: 0.001
      weight_decay: 0.01
  scheduler:
    module: torch.optim.lr_scheduler
    name: CosineAnnealingLR
    kwargs:
      T_max: 199
    need_loss: false
  criterion:
    module: torch.nn
    name: CrossEntropyLoss
    kwargs: null

fine_tuning:
  n_epochs: 5
  trainable: all
  optimizer:
    module: torch.optim
    name: AdamW
    kwargs:
      lr: 0.0001
      weight_decay: 0.01
  scheduler:
    module: torch.optim.lr_scheduler
    name: CosineAnnealingLR
    kwargs:
      T_max: 4
    need_loss: false
  criterion:
    module: torch.nn
    name: CrossEntropyLoss
    kwargs: null
